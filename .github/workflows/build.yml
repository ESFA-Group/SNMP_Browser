name: Build and Package

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:

env:
  APP_NAME: SNMPBrowser
  APP_VERSION: "1.0.0"

jobs:
  # ──────────────────────────────────────────────────────────────
  # Linux  (x86_64 on ubuntu-24.04,  arm64 on ubuntu-24.04-arm)
  # ──────────────────────────────────────────────────────────────
  build-linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            deploy_arch: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            deploy_arch: aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-svg-dev \
            qml6-module-qtqml-workerscript \
            qml6-module-qtquick \
            qml6-module-qtquick-window \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-dialogs \
            qml6-module-qtquick-templates \
            qml6-module-qt-labs-platform \
            libsnmp-dev \
            cmake \
            build-essential \
            libgl-dev \
            patchelf \
            imagemagick \
            wget

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Install to AppDir
        run: DESTDIR="${{ github.workspace }}/AppDir" cmake --install build

      - name: Prepare AppDir metadata
        run: |
          mkdir -p AppDir/usr/share/applications
          cat > AppDir/usr/share/applications/snmpbrowser.desktop << 'EOF'
          [Desktop Entry]
          Name=SNMP Browser
          Exec=SNMPBrowser
          Icon=snmpbrowser
          Type=Application
          Categories=Network;Utility;
          Comment=SNMPv3 network browser
          EOF

          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          convert -size 256x256 xc:"#1565C0" \
            -fill white -gravity Center \
            -font DejaVu-Sans-Bold -pointsize 44 \
            -annotate 0 "SNMP" \
            AppDir/usr/share/icons/hicolor/256x256/apps/snmpbrowser.png

          cat > AppDir/AppRun << 'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"

          # The AppImage currently bundles Qt's xcb platform plugin only.
          # On Wayland desktops Qt may auto-select wayland, which fails when
          # libqwayland-* is not bundled. Fall back to xcb unless the caller
          # explicitly selected another non-Wayland platform.
          case "${QT_QPA_PLATFORM:-}" in
            ""|wayland|wayland-egl)
              export QT_QPA_PLATFORM=xcb
              ;;
          esac

          exec "$HERE/usr/bin/SNMPBrowser" "$@"
          EOF
          chmod +x AppDir/AppRun

      - name: Locate qmake6
        run: |
          QMAKE=$(command -v qmake6 2>/dev/null || command -v qmake 2>/dev/null)
          echo "QMAKE=$QMAKE" >> "$GITHUB_ENV"
          "$QMAKE" --version

      - name: Prepare Qt QML module paths
        run: |
          set -eux
          QT_QML_DIR="$($QMAKE -query QT_INSTALL_QML)"
          echo "QT_QML_DIR=$QT_QML_DIR"
          find "$QT_QML_DIR" -maxdepth 3 -type d | sort | sed -n '1,120p'

          test -d "$QT_QML_DIR/QtQml/WorkerScript"
          test -d "$QT_QML_DIR/QtQuick"
          test -d "$QT_QML_DIR/QtQuick/Window"
          test -d "$QT_QML_DIR/QtQuick/Controls"
          test -d "$QT_QML_DIR/QtQuick/Layouts"
          test -d "$QT_QML_DIR/QtQuick/Dialogs"
          test -d "$QT_QML_DIR/QtQuick/Templates"
          test -d "$QT_QML_DIR/Qt/labs/platform"

          echo "QT_QML_DIR=$QT_QML_DIR" >> "$GITHUB_ENV"
          echo "QML_MODULES_PATHS=$QT_QML_DIR" >> "$GITHUB_ENV"

      - name: Download linuxdeploy
        run: |
          wget -q -O linuxdeploy.AppImage \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.deploy_arch }}.AppImage"
          wget -q -O linuxdeploy-plugin-qt.AppImage \
            "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-${{ matrix.deploy_arch }}.AppImage"
          chmod +x linuxdeploy.AppImage linuxdeploy-plugin-qt.AppImage

      - name: Create AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          QML_SOURCES_PATHS: ${{ github.workspace }}/resources/qml
          OUTPUT: ${{ env.APP_NAME }}-${{ env.APP_VERSION }}-linux-${{ matrix.arch }}.AppImage
        run: |
          ./linuxdeploy.AppImage \
            --appdir AppDir \
            --plugin qt \
            --output appimage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-linux-${{ matrix.arch }}
          path: ${{ env.APP_NAME }}-*-linux-${{ matrix.arch }}.AppImage

  # ──────────────────────────────────────────────────────────────
  # Windows x86_64  (MSVC + net-snmp's own win32/Configure build)
  # ──────────────────────────────────────────────────────────────
  build-windows:
    name: Windows x86_64
    runs-on: windows-latest

    env:
      NETSNMP_VERSION: "5.9.4"
      NETSNMP_PREFIX: ${{ github.workspace }}\netsnmp-install
      OPENSSL_DIR: C:\vcpkg\installed\x64-windows

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Cache vcpkg OpenSSL
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-openssl-x64-windows-v1

      - name: Install OpenSSL via vcpkg
        shell: cmd
        run: vcpkg install openssl:x64-windows --recurse

      - name: Prepare OpenSSL environment for MSVC
        shell: cmd
        run: |
          if not exist "${{ env.OPENSSL_DIR }}\include\openssl\ossl_typ.h" (
            echo OpenSSL headers not found under ${{ env.OPENSSL_DIR }}\include
            dir "${{ env.OPENSSL_DIR }}" /s /b | findstr /i "ossl_typ.h"
            exit /b 1
          )
          if not exist "${{ env.OPENSSL_DIR }}\lib\libcrypto.lib" (
            echo libcrypto.lib not found under ${{ env.OPENSSL_DIR }}\lib
            dir "${{ env.OPENSSL_DIR }}\lib" /b
            exit /b 1
          )
          if not exist "${{ env.OPENSSL_DIR }}\lib\libssl.lib" (
            echo libssl.lib not found under ${{ env.OPENSSL_DIR }}\lib
            dir "${{ env.OPENSSL_DIR }}\lib" /b
            exit /b 1
          )
          copy /Y "${{ env.OPENSSL_DIR }}\lib\libcrypto.lib" "${{ env.OPENSSL_DIR }}\lib\libcrypto64MD.lib"
          copy /Y "${{ env.OPENSSL_DIR }}\lib\libssl.lib" "${{ env.OPENSSL_DIR }}\lib\libssl64MD.lib"
          dir "${{ env.OPENSSL_DIR }}\lib" /b | findstr /i "libcrypto libssl"
          echo INCLUDE=${{ env.OPENSSL_DIR }}\include;%INCLUDE%>>%GITHUB_ENV%
          echo LIB=${{ env.OPENSSL_DIR }}\lib;%LIB%>>%GITHUB_ENV%
          echo PATH=${{ env.OPENSSL_DIR }}\bin;%PATH%>>%GITHUB_ENV%

      - name: Cache net-snmp install
        id: cache-netsnmp
        uses: actions/cache@v4
        with:
          path: ${{ env.NETSNMP_PREFIX }}
          key: netsnmp-${{ env.NETSNMP_VERSION }}-msvc-x64-v6

      - name: Download net-snmp source
        if: steps.cache-netsnmp.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          curl -L --fail --retry 3 -o net-snmp.zip ^
            "https://downloads.sourceforge.net/project/net-snmp/net-snmp/${{ env.NETSNMP_VERSION }}/net-snmp-${{ env.NETSNMP_VERSION }}.zip"
          if errorlevel 1 exit /b 1
          tar -xf net-snmp.zip
          if errorlevel 1 exit /b 1
          dir net-snmp-${{ env.NETSNMP_VERSION }}

      - name: Build net-snmp (win32/Configure + nmake)
        if: steps.cache-netsnmp.outputs.cache-hit != 'true'
        shell: cmd
        working-directory: net-snmp-${{ env.NETSNMP_VERSION }}\win32
        run: |
          set INCLUDE=${{ env.OPENSSL_DIR }}\include;%INCLUDE%
          set LIB=${{ env.OPENSSL_DIR }}\lib;%LIB%
          set PATH=${{ env.OPENSSL_DIR }}\bin;%PATH%
          perl Configure ^
            --linktype=dynamic ^
            --config=release ^
            --prefix=${{ env.NETSNMP_PREFIX }} ^
            --with-ssl ^
            --with-sdk
          if errorlevel 1 exit /b 1
          nmake
          if errorlevel 1 exit /b 1
          nmake install
          if errorlevel 1 exit /b 1

      - name: Normalize net-snmp install layout
        shell: pwsh
        run: |
          $includeDir = "${{ env.NETSNMP_PREFIX }}\include"
          $libDir = "${{ env.NETSNMP_PREFIX }}\lib"
          $binDir = "${{ env.NETSNMP_PREFIX }}\bin"
          $libTarget = Join-Path $libDir "netsnmp.lib"
          $headerTarget = Join-Path $includeDir "net-snmp\net-snmp-includes.h"
          $securityHeaderTarget = Join-Path $includeDir "net-snmp\library\snmpv3-security-includes.h"
          $dllTargetDir = $binDir

          New-Item -ItemType Directory -Force $includeDir | Out-Null
          New-Item -ItemType Directory -Force $libDir | Out-Null
          New-Item -ItemType Directory -Force $binDir | Out-Null

          $header = Get-ChildItem -Path "${{ github.workspace }}" -Recurse -Filter net-snmp-includes.h -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -ine $headerTarget } |
            Select-Object -First 1

          if ($header) {
            $sourceIncludeDir = Split-Path (Split-Path $header.FullName -Parent) -Parent
            Write-Host "Copying Net-SNMP include tree from $sourceIncludeDir to $includeDir"
            Copy-Item (Join-Path $sourceIncludeDir "*") $includeDir -Recurse -Force
          }

          # Net-SNMP's MSVC build generates a few headers outside the installed
          # include root. Copy every header below a net-snmp path while preserving
          # the path from the net-snmp directory onward.
          Get-ChildItem -Path "${{ github.workspace }}" -Recurse -Include "*.h" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "\\net-snmp\\" } |
            ForEach-Object {
              $sourcePath = $_.FullName
              $matchIndex = $sourcePath.ToLowerInvariant().LastIndexOf("\net-snmp\")
              if ($matchIndex -lt 0) { return }
              $relativePath = $sourcePath.Substring($matchIndex + 1)
              $targetPath = Join-Path $includeDir $relativePath
              if ($sourcePath -ieq $targetPath) { return }
              New-Item -ItemType Directory -Force (Split-Path $targetPath -Parent) | Out-Null
              Copy-Item $sourcePath $targetPath -Force
            }

          if (-not (Test-Path $headerTarget)) {
            Write-Host "Could not find net-snmp/net-snmp-includes.h after normalization. Current include files:"
            Get-ChildItem -Path "${{ github.workspace }}" -Recurse -Include "*.h" -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match "net-snmp|snmp" } |
              Select-Object -ExpandProperty FullName
            exit 1
          }

          if (-not (Test-Path $securityHeaderTarget)) {
            Write-Host "Could not find net-snmp/library/snmpv3-security-includes.h after normalization. Current matching files:"
            Get-ChildItem -Path "${{ github.workspace }}" -Recurse -Include "*security*includes*.h","snmpv3*.h" -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName
            exit 1
          }

          $lib = Get-ChildItem -Path "${{ github.workspace }}" -Recurse -Filter netsnmp.lib -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -ine $libTarget } |
            Where-Object { $_.FullName -match '\\release\\|\\lib\\' } |
            Select-Object -First 1

          if ($lib) {
            Copy-Item $lib.FullName $libTarget -Force
          } elseif (-not (Test-Path $libTarget)) {
            Write-Host "Could not find netsnmp.lib. Current Net-SNMP files:"
            Get-ChildItem -Path "${{ github.workspace }}" -Recurse -Include "*snmp*.lib","*snmp*.dll" -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName
            exit 1
          } else {
            Write-Host "netsnmp.lib already normalized at $libTarget"
          }

          Get-ChildItem -Path "${{ github.workspace }}" -Recurse -Filter netsnmp.dll -ErrorAction SilentlyContinue |
            ForEach-Object {
              $dllTarget = Join-Path $dllTargetDir $_.Name
              if ($_.FullName -ieq $dllTarget) {
                Write-Host "Skipping already-normalized DLL $dllTarget"
              } else {
                Copy-Item $_.FullName -Destination $dllTargetDir -Force
              }
            }

          Get-ChildItem -Path "${{ env.NETSNMP_PREFIX }}" -Recurse |
            Select-Object -ExpandProperty FullName

      - name: Configure (CMake)
        shell: cmd
        run: |
          cmake -B build -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DNET_SNMP_ROOT="${{ env.NETSNMP_PREFIX }}" ^
            -DCMAKE_PREFIX_PATH="${{ env.NETSNMP_PREFIX }}"

      - name: Build
        shell: cmd
        run: cmake --build build --config Release

      - name: Deploy to dist/
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\SNMPBrowser.exe dist\

          # Qt runtime + QML modules. --compiler-runtime drops vc_redist.x64.exe
          # into dist so the installer can set up the MSVC runtime on machines
          # that do not have it. The app forces the software scene graph on
          # Windows, so the opengl32sw fallback DLL is dead weight.
          windeployqt --release `
            --qmldir resources/qml `
            --no-translations `
            --no-opengl-sw `
            --compiler-runtime `
            dist\SNMPBrowser.exe

          # net-snmp DLL + OpenSSL DLLs
          Copy-Item "${{ env.NETSNMP_PREFIX }}\bin\*.dll" dist\
          Copy-Item "${{ env.OPENSSL_DIR }}\bin\libssl-*.dll" dist\
          Copy-Item "${{ env.OPENSSL_DIR }}\bin\libcrypto-*.dll" dist\

          Get-ChildItem dist\

      - name: Verify deployment completeness
        shell: pwsh
        run: |
          $missing = @()
          foreach ($f in @("SNMPBrowser.exe", "Qt6Core.dll", "Qt6Gui.dll",
                           "Qt6Qml.dll", "Qt6Quick.dll", "Qt6QuickControls2.dll",
                           "netsnmp.dll", "vc_redist.x64.exe")) {
            if (-not (Test-Path "dist\$f")) { $missing += $f }
          }
          foreach ($d in @("dist\qml\QtQuick", "dist\qml\QtQuick\Controls",
                           "dist\qml\QtQuick\Dialogs", "dist\platforms")) {
            if (-not (Test-Path $d)) { $missing += $d }
          }
          if (-not (Get-ChildItem "dist\libssl-*.dll" -ErrorAction SilentlyContinue)) { $missing += "libssl-*.dll" }
          if (-not (Get-ChildItem "dist\libcrypto-*.dll" -ErrorAction SilentlyContinue)) { $missing += "libcrypto-*.dll" }
          if ($missing.Count -gt 0) {
            Write-Host "Deployment is missing:" -ForegroundColor Red
            $missing | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
          Write-Host "All required runtime files present."

      - name: Build installer (InnoSetup)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion=${{ env.APP_VERSION }} `
            "/DMyAppSourceDir=..\dist" `
            installer\windows.iss

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-windows-x86_64
          path: installer\output\*.exe

  # ──────────────────────────────────────────────────────────────
  # GitHub Release  (runs only on version tags, e.g. v1.0.0)
  # ──────────────────────────────────────────────────────────────
  release:
    name: Create Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
